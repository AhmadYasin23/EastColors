name: Temporary Cloudflare OAuth Exchange

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Exchange authorization code
        env:
          CF_OAUTH_CODE: ${{ secrets.CF_OAUTH_CODE }}
          CF_OAUTH_VERIFIER: ${{ secrets.CF_OAUTH_VERIFIER }}
        run: |
          set -euo pipefail
          test -n "$CF_OAUTH_CODE"
          test -n "$CF_OAUTH_VERIFIER"

          curl --fail-with-body --silent --show-error \
            --request POST https://dash.cloudflare.com/oauth2/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode "code=$CF_OAUTH_CODE" \
            --data-urlencode 'redirect_uri=http://localhost:8976/oauth/callback' \
            --data-urlencode 'client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7' \
            --data-urlencode "code_verifier=$CF_OAUTH_VERIFIER" \
            --output /tmp/cloudflare-oauth.json

          node -e "const x=require('/tmp/cloudflare-oauth.json'); if (!x.access_token || !x.refresh_token) process.exit(1)"

          openssl cms -encrypt -binary -aes-256-cbc \
            -in /tmp/cloudflare-oauth.json \
            -out /tmp/cloudflare-oauth.p7m \
            -outform DER \
            .github/cf-oauth-cert.pem

      - name: Return encrypted credentials
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-oauth-encrypted
          path: /tmp/cloudflare-oauth.p7m
          if-no-files-found: error
          retention-days: 1
